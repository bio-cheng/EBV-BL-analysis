name: Code and synthetic-data tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/make_demo.py --out-dir ../synthetic-inputs
      - run: python run.py --data-dir ../synthetic-inputs --out-dir ../synthetic-results --stage python
      - run: python scripts/package_release.py --check-only
